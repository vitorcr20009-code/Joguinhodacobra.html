<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Royale - Ranking</title>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; touch-action: none; }
        canvas { border: 4px solid #38bdf8; background: #000; border-radius: 10px; }
        
        .header { text-align: center; margin-bottom: 10px; }
        .score-board { display: flex; gap: 20px; font-size: 18px; margin-bottom: 10px; color: #38bdf8; }
        
        /* Overlay de Nome */
        #nameOverlay { position: absolute; background: rgba(15, 23, 42, 0.95); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        input { padding: 12px; border-radius: 8px; border: none; margin-bottom: 10px; width: 200px; text-align: center; font-size: 16px; }
        button.start-btn { padding: 10px 25px; background: #38bdf8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Controles */
        .controls { margin-top: 15px; display: grid; grid-template-columns: repeat(3, 65px); gap: 8px; }
        .btn { width: 65px; height: 65px; background: #1e293b; border: 2px solid #38bdf8; color: white; border-radius: 12px; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #up { grid-column: 2; }
        #left { grid-column: 1; }
        #down { grid-column: 2; }
        #right { grid-column: 3; }

        .share-btn { margin-top: 15px; background: #25d366; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <div id="nameOverlay">
        <h2>Quem está jogando?</h2>
        <input type="text" id="playerName" placeholder="Seu Nome" maxlength="10">
        <button class="start-btn" onclick="startGame()">COMEÇAR JOGO</button>
    </div>

    <div class="header">
        <div class="score-board">
            <div>Jogador: <span id="displayName">---</span></div>
            <div>Pontos: <span id="currentScore">0</span></div>
        </div>
        <div style="color: #fbbf24; font-weight: bold;">Recorde: <span id="highScore">0</span> (<span id="highName">---</span>)</div>
    </div>

    <canvas id="game" width="300" height="300"></canvas>

    <div class="controls">
        <div class="btn" id="up" onmousedown="setDir('UP')" ontouchstart="setDir('UP')">▲</div>
        <div class="btn" id="left" onmousedown="setDir('LEFT')" ontouchstart="setDir('LEFT')">◀</div>
        <div class="btn" id="down" onmousedown="setDir('DOWN')" ontouchstart="setDir('DOWN')">▼</div>
        <div class="btn" id="right" onmousedown="setDir('RIGHT')" ontouchstart="setDir('RIGHT')">▶</div>
    </div>

    <button class="share-btn" onclick="shareScore()">Mandar Recorde pros Amigos 🚀</button>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    
    let box = 20;
    let score = 0;
    let snake = [{x: 8 * box, y: 8 * box}];
    let d = "RIGHT";
    let food = { x: Math.floor(Math.random() * 14) * box, y: Math.floor(Math.random() * 14) * box };
    let gameRunning = false;
    let playerName = "";

    // Imagem da maçã
    const appleImg = new Image();
    appleImg.src = "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y";

    // Carregar Recorde do Navegador
    let savedHighScore = localStorage.getItem("highScore") || 0;
    let savedHighName = localStorage.getItem("highName") || "Ninguém";
    document.getElementById("highScore").innerText = savedHighScore;
    document.getElementById("highName").innerText = savedHighName;

    function startGame() {
        playerName = document.getElementById("playerName").value || "Anônimo";
        document.getElementById("displayName").innerText = playerName;
        document.getElementById("nameOverlay").style.display = "none";
        gameRunning = true;
    }

    function setDir(newDir) {
        if (newDir == "LEFT" && d != "RIGHT") d = "LEFT";
        else if (newDir == "UP" && d != "DOWN") d = "UP";
        else if (newDir == "RIGHT" && d != "LEFT") d = "RIGHT";
        else if (newDir == "DOWN" && d != "UP") d = "DOWN";
    }

    document.addEventListener("keydown", e => {
        if (e.keyCode == 37) setDir("LEFT");
        if (e.keyCode == 38) setDir("UP");
        if (e.keyCode == 39) setDir("RIGHT");
        if (e.keyCode == 40) setDir("DOWN");
    });

    function draw() {
        if (!gameRunning) return;

        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Desenha Cobra
        for (let i = 0; i < snake.length; i++) {
            ctx.fillStyle = (i == 0) ? "#38bdf8" : "#1e293b";
            ctx.fillRect(snake[i].x, snake[i].y, box, box);
        }

        // Desenha Comida
        ctx.drawImage(appleImg, food.x, food.y, box, box);

        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if (d == "LEFT") snakeX -= box;
        if (d == "UP") snakeY -= box;
        if (d == "RIGHT") snakeX += box;
        if (d == "DOWN") snakeY += box;

        // Infinito (Atravessar Parede)
        if (snakeX < 0) snakeX = canvas.width - box;
        if (snakeX >= canvas.width) snakeX = 0;
        if (snakeY < 0) snakeY = canvas.height - box;
        if (snakeY >= canvas.height) snakeY = 0;

        // Lógica de comer
        if (snakeX == food.x && snakeY == food.y) {
            score++;
            document.getElementById("currentScore").innerText = score;
            
            // Atualizar Recorde em Tempo Real
            if (score > savedHighScore) {
                savedHighScore = score;
                savedHighName = playerName;
                localStorage.setItem("highScore", score);
                localStorage.setItem("highName", playerName);
                document.getElementById("highScore").innerText = score;
                document.getElementById("highName").innerText = playerName;
            }

            food = {
                x: Math.floor(Math.random() * 14) * box,
                y: Math.floor(Math.random() * 14) * box
            };
        } else {
            snake.pop();
        }

        snake.unshift({ x: snakeX, y: snakeY });
    }

    function shareScore() {
        const text = `Fiz ${score} pontos no Snake Infinito! Meu recorde é ${savedHighScore}. Consegue bater? 🔥`;
        navigator.clipboard.writeText(text);
        alert("Pontuação copiada! Agora é só colar no WhatsApp dos amigos.");
    }

    setInterval(draw, 120);
</script>
</body>
</html>
